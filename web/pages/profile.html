<section id="profile">
<h2>My profile</h2>
<form method="post" action="/action">
  {{TOKEN}}<input type="hidden" name="action" value="profile">
  <label>Name <input name="name" value="{{NAME}}" maxlength="100" required></label>
  <label>Email <input type="email" name="email" value="{{EMAIL}}" maxlength="150" required></label>
  <label>Phone <input type="tel" name="phone" value="{{PHONE}}" maxlength="20" required></label>
  <button type="submit">Save profile</button>
</form>
<form method="post" action="/action">
  {{TOKEN}}<input type="hidden" name="action" value="password">
  <h3>Change password</h3>
  <label>Current password <input type="password" name="oldPassword" autocomplete="current-password" required></label>
  <label>New password <input type="password" name="newPassword" autocomplete="new-password" required></label>
  <button type="submit">Change password</button>
</form>
</section>
