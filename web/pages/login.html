<h2>Log in</h2>
<p>Use your existing food bank account.</p>
<form method="post" action="/action">
  <input type="hidden" name="csrf" value="{{CSRF}}">
  <input type="hidden" name="action" value="login">
  <label>Email <input type="email" name="email" autocomplete="username" required></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit">Log in</button>
</form>
<h2>Create an account</h2>
<p>Donors and recipients can sign up here. A coordinator must approve new recipients.</p>
<form method="post" action="/action">
  <input type="hidden" name="csrf" value="{{CSRF}}">
  <input type="hidden" name="action" value="register">
  <label>Account type <select name="role"><option>Donor</option><option>Recipient</option></select></label>
  <label>Name <input name="name" maxlength="100" required></label>
  <label>Email <input type="email" name="email" maxlength="150" required></label>
  <label>Phone <input type="tel" name="phone" maxlength="20" required></label>
  <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
  <fieldset>
    <legend>Recipient details — fill in if signing up as a recipient</legend>
    <label>Household size <input type="number" name="householdSize" value="1" min="1" step="1"></label>
    <label>Dietary restrictions or allergies <input name="diet" maxlength="255"></label>
    <label>Emergency contact <input name="contact" maxlength="150"></label>
  </fieldset>
  <button type="submit">Create account</button>
</form>
