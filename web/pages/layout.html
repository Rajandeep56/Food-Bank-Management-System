<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Bank Management System</title>
  <style>
    body { font: 16px Arial, sans-serif; color: #222; max-width: 1000px; margin: 24px auto; padding: 0 16px; background: white; }
    h1 { color: #245b3b; font-size: 26px; }
    h2 { margin-top: 32px; font-size: 22px; }
    h3 { font-size: 18px; }
    nav { border-bottom: 1px solid #ccc; padding-bottom: 12px; }
    nav a { margin-right: 16px; }
    a { color: #245b3b; }
    form { border: 1px solid #ccc; padding: 16px; margin: 16px 0; }
    label { display: block; margin: 12px 0; }
    input, select, button { font: inherit; padding: 7px; max-width: 100%; box-sizing: border-box; }
    input, select { display: block; width: 320px; margin-top: 5px; }
    button { cursor: pointer; margin: 4px 8px 4px 0; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #ccc; padding: 9px; text-align: left; }
    th { background: #f3f3f3; }
    .table { overflow-x: auto; }
    .message { padding: 12px; border: 1px solid #888; background: #f5f5f5; }
    nav form { display: inline; border: 0; padding: 0; margin: 0; }
    fieldset { border: 1px solid #ccc; margin: 16px 0; }
  </style>
</head>
<body>
  <header><h1>Food Bank Management System</h1></header>
  {{NAV}}
  {{MESSAGE}}
  <main>{{CONTENT}}</main>
</body>
</html>
