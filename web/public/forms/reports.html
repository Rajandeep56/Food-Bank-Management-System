<h2>Reports</h2>
<form onsubmit="sendForm(event)">
    <h3>Generate report</h3><input type="hidden" name="action" value="report">
    <label>Report <select name="reportType"><option value="donations">Donation and distribution summary</option><option value="waste">Inventory waste summary</option></select></label>
    <label>Period <select name="period"><option value="MONTHLY">Monthly</option><option value="YEARLY">Yearly</option></select></label>
    <label>Year <input type="number" name="year" min="1" required></label><label>Month (monthly report) <input type="number" name="month" min="1" max="12" value="1" required></label>
    <button>Generate report</button>
  </form>
<form id="recordSearch" onsubmit="loadRecords(event)">
  <input type="hidden" name="type" value="report">
  
  <button>Search records</button>
</form>
<pre id="records" aria-live="polite">Loading records...</pre>
