<h2>Create an account</h2>
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="register">
    <label>Role <select name="role"><option>Donor</option><option>Recipient</option></select></label>
    <label>Name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Phone <input type="tel" name="phone" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <p>Fill in the next three fields for a recipient account.</p>
    <label>Household size <input type="number" name="householdSize" min="1" value="1"></label>
    <label>Dietary restrictions <input name="diet"></label>
    <label>Emergency contact <input name="contact"></label>
    <button>Create account</button>
  </form>
<p><a href="#login">Back to log in</a></p>
