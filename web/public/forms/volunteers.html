<h2>Volunteer accounts</h2>
<form id="recordSearch" onsubmit="loadRecords(event)">
  <input type="hidden" name="type" value="users"><input type="hidden" name="role" value="Volunteer">
  <label>Volunteer name <input name="name"></label>
  <button>Search records</button>
</form>
<pre id="records" aria-live="polite">Loading records...</pre>
<form onsubmit="sendForm(event)">
    <h3>Create volunteer account</h3><input type="hidden" name="action" value="createVolunteer">
    <label>Name <input name="name" required></label><label>Email <input type="email" name="email" required></label>
    <label>Phone <input type="tel" name="phone" required></label><label>Password <input type="password" name="password" autocomplete="new-password" required></label>
    <label>Availability <select name="availability"><option>Any</option><option>Weekdays</option><option>Weekends</option></select></label>
    <button>Create volunteer</button>
  </form>
<form onsubmit="sendForm(event)">
    <h3>Change volunteer availability</h3><input type="hidden" name="action" value="availability">
    <div class="choice">
  <label>Find volunteer <input type="search" placeholder="Type a name to filter choices" oninput="filterChoices(this)"></label>
  <label>Volunteer <select name="userId" data-options="volunteers" data-empty="Choose volunteer" required><option value="">Loading choices...</option></select></label>
</div>
    <label>Availability <select name="availability"><option>Any</option><option>Weekdays</option><option>Weekends</option></select></label><button>Save availability</button>
  </form>
