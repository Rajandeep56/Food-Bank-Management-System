<h2>My hamper requests</h2><p>Your account must be approved before requesting a hamper. You can check approval under My profile.</p>
<form id="recordSearch" onsubmit="loadRecords(event)">
  <input type="hidden" name="type" value="requests">
  
  <button>Search records</button>
</form>
<pre id="records" aria-live="polite">Loading records...</pre>
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="requestHamper">
    <label>Pickup date <input type="date" name="date" required></label><label>Pickup time <input type="time" name="time" value="10:00" required></label>
    <button>Request hamper</button>
  </form>
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="cancelRequest">
    <div class="choice">
  <label>Find request <input type="search" placeholder="Type a name to filter choices" oninput="filterChoices(this)"></label>
  <label>Request <select name="requestId" data-options="requests" data-empty="Choose request" required><option value="">Loading choices...</option></select></label>
</div><button>Cancel request</button>
  </form>
