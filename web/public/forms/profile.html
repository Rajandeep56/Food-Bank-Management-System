<h2>My profile</h2>
<form id="recordSearch" onsubmit="loadRecords(event)">
  <input type="hidden" name="type" value="profile">
  
  <button>Search records</button>
</form>
<pre id="records" aria-live="polite">Loading records...</pre>
<h3>Update contact details</h3>
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="profile">
    <label>Name <input name="name" required></label><label>Email <input type="email" name="email" required></label>
    <label>Phone <input type="tel" name="phone" required></label><button>Save profile</button>
  </form>
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="password">
    <label>Current password <input type="password" name="oldPassword" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="newPassword" autocomplete="new-password" required></label><button>Change password</button>
  </form>
<div data-roles="Recipient">
<form onsubmit="sendForm(event)">
    <input type="hidden" name="action" value="recipientProfile">
    <label>Household size <input type="number" name="householdSize" min="1" required></label>
    <label>Dietary restrictions <input name="diet"></label><label>Emergency contact <input name="contact" required></label>
    <button>Save household details</button>
  </form>
</div>
