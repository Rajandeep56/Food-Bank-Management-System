<section id="work">
<h2>My food hamper requests</h2>
<p>Approval status: <strong>{{APPROVAL}}</strong></p>
{{REQUESTS}}
<form method="post" action="/action">
  {{TOKEN}}<input type="hidden" name="action" value="requestHamper">
  <h3>Request a hamper and schedule pickup</h3>
  <label>Pickup date <input type="date" name="date" min="{{TODAY}}" required></label>
  <label>Pickup time <input type="time" name="time" value="10:00" required></label>
  <button type="submit">Request hamper</button>
</form>
<form method="post" action="/action">
  {{TOKEN}}<input type="hidden" name="action" value="cancelRequest">
  <label>Request <select name="requestId" required>{{CANCEL_REQUESTS}}</select></label>
  <button type="submit">Cancel request</button>
</form>
<h2>My distribution history</h2>
<form method="get" action="/">
  <label>From <input type="date" name="from"></label>
  <label>To <input type="date" name="to"></label>
  <button type="submit">Search history</button><a href="/">Clear search</a>
</form>
{{DISTRIBUTIONS}}
<h2>My household details</h2>
<form method="post" action="/action">
  {{TOKEN}}<input type="hidden" name="action" value="recipientProfile">
  <label>Household size <input type="number" name="householdSize" min="1" step="1" value="{{HOUSEHOLD}}" required></label>
  <label>Dietary restrictions or allergies <input name="diet" value="{{DIET}}" maxlength="255"></label>
  <label>Emergency contact <input name="contact" value="{{CONTACT}}" maxlength="150" required></label>
  <button type="submit">Save household details</button>
</form>
</section>
